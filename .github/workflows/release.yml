# Publishes Jaunt to nuget.org when a version tag is pushed: git tag v1.0.1 && git push origin v1.0.1
# The full verify.yml matrix must pass first. The tag is the package version.
#
# Authentication is NuGet Trusted Publishing: no API key is stored anywhere. The publish job exchanges its GitHub OIDC
# token for a NuGet API key that is valid for one hour. It needs, once:
#   - nuget.org > Trusted Publishing policy: owner AIDotNet, repository Jaunt, workflow file release.yml, environment nuget
#   - GitHub > Settings > Environments > nuget: secret NUGET_USER, the nuget.org profile name (not an email address)
# See https://learn.microsoft.com/nuget/nuget-org/trusted-publishing
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  pack:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      # Third-party actions are pinned to full commit SHAs throughout this release path.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          # the 8.0 and 10.0 runtimes are for the consumer test; the 11 SDK is the one that builds the package
          dotnet-version: |
            8.0.x
            10.0.401
            11.0.100

      - name: Read the package version from the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not vMAJOR.MINOR.PATCH[-prerelease]"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      # eng/sdk11/global.json selects the .NET 11 SDK, which adds net11.0 to the net8.0 and net10.0 assets
      - name: Pack
        working-directory: eng/sdk11
        run: >
          dotnet pack "$GITHUB_WORKSPACE/src/Jaunt" -c Release -o "$GITHUB_WORKSPACE/artifacts/package"
          -p:Version=${{ steps.version.outputs.value }}
          -p:ContinuousIntegrationBuild=true

      - name: Test the package as a consumer
        run: ./eng/verify-package.sh artifacts/package

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-package
          path: artifacts/package/*
          if-no-files-found: error

  publish:
    needs: pack
    runs-on: ubuntu-24.04
    environment: nuget
    permissions:
      id-token: write # lets this job request the GitHub OIDC token that NuGet/login exchanges
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget-package
          path: package

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.401

      # Runs immediately before the push because the key lasts one hour.
      - name: NuGet login (OIDC to temporary API key)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      # dotnet nuget push also uploads the .snupkg next to each .nupkg.
      # --skip-duplicate makes re-running this job safe after a partial failure.
      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: >
          dotnet nuget push "package/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
